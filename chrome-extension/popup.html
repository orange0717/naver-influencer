<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>N인플 키워드 분석</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="popup-logo">N</div>
    <div>
      <div class="popup-title">N인플 키워드 분석</div>
      <div class="popup-ver">v2.0.0</div>
    </div>
  </div>

  <div class="popup-body">
    <label class="popup-row">
      <span>키워드 검색량</span>
      <input type="checkbox" id="opt-keyword" checked>
      <span class="toggle-slider"></span>
    </label>
    <label class="popup-row">
      <span>연관검색어</span>
      <input type="checkbox" id="opt-related" checked>
      <span class="toggle-slider"></span>
    </label>
    <label class="popup-row">
      <span>글자수 표시</span>
      <input type="checkbox" id="opt-charwidget" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="popup-desc">
    네이버 검색 페이지에서 키워드 분석 카드가 자동으로 표시됩니다.<br>
    텍스트 입력 시 글자수가 실시간으로 표시됩니다.
  </div>

  <div class="popup-footer">
    <a href="https://ninfle.kr" target="_blank">N인플 대시보드 바로가기</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
