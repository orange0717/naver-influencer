<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <div class="sp-header">
    <div class="sp-logo">N</div>
    <h1>N인플 분석</h1>
  </div>

  <!-- Tab Navigation -->
  <div class="sp-tabs">
    <button class="sp-tab active" data-tab="keyword">키워드 분석</button>
    <button class="sp-tab" data-tab="blog">블로그 분석</button>
    <button class="sp-tab" data-tab="ranking">순위 확인</button>
  </div>

  <!-- Keyword Analysis Tab -->
  <div class="sp-panel" id="panelKeyword">
    <div class="sp-input-row">
      <input type="text" id="kwInput" placeholder="키워드 (쉼표로 여러 개)" />
      <button id="kwSearchBtn">검색</button>
    </div>
    <div class="sp-results" id="kwResults">
      <div class="sp-empty">키워드를 입력하거나<br>네이버 검색 페이지에서 자동 감지됩니다.</div>
    </div>
  </div>

  <!-- Blog Analysis Tab -->
  <div class="sp-panel" id="panelBlog" style="display:none;">
    <div class="sp-input-row">
      <input type="text" id="blogInput" placeholder="블로그 ID 입력" />
      <button id="blogSearchBtn">분석</button>
    </div>
    <div class="sp-results" id="blogResults">
      <div class="sp-empty">블로그 페이지에서<br>자동으로 ID가 감지됩니다.</div>
    </div>
  </div>

  <!-- Ranking Tab -->
  <div class="sp-panel" id="panelRanking" style="display:none;">
    <div class="sp-input-row">
      <input type="text" id="rankKwInput" placeholder="키워드 입력" />
      <button id="rankSearchBtn">TOP 확인</button>
    </div>
    <div class="sp-rank-tabs" id="rankSubTabs">
      <button class="sp-rank-tab active" data-rtab="blog">블로그</button>
      <button class="sp-rank-tab" data-rtab="influencer">인플루언서</button>
      <button class="sp-rank-tab" data-rtab="view">통합검색</button>
    </div>
    <div class="sp-results" id="rankResults">
      <div class="sp-empty">키워드를 입력하면<br>TOP 순위를 확인합니다.</div>
    </div>
  </div>

  <!-- Loading (shared) -->
  <div class="sp-loading" id="loading" style="display:none;">
    <div class="sp-spinner"></div>
    <span id="loadingText">분석 중...</span>
  </div>

  <!-- Footer -->
  <div class="sp-footer">
    <a href="https://naver-influencer.vercel.app" target="_blank">
      대시보드에서 더 보기 →
    </a>
  </div>

  <script src="src/sidepanel.js"></script>
</body>
</html>
