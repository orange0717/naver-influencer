name: 인플루언서 프로필 주간 갱신

# 매주 월요일 KST 03:00 (월요일 18:00 UTC) 에 실행
# 필요 시 수동 실행도 가능 (workflow_dispatch)
on:
  schedule:
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      stale_days:
        description: 'N일 이상 stale 인 인플루언서만 갱신 (기본 3)'
        required: false
        default: '3'
      limit:
        description: '최대 N명 (기본 all)'
        required: false
        default: ''

jobs:
  refresh:
    name: 프로필(팬수/챌린지수) 일괄 갱신
    runs-on: ubuntu-latest
    # 10,000명 × 1.5초 ≒ 4시간 10분 + 여유 → 5시간 상한
    timeout-minutes: 330

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치 (supabase-js 만 필요)
        run: npm install @supabase/supabase-js --no-save --no-audit --no-fund

      - name: 환경변수 구성
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error ::NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets 가 설정되어 있지 않습니다."
            exit 1
          fi
          # .env.local 로 작성 (스크립트가 읽음)
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.local

      - name: 갱신 실행
        run: |
          STALE=${{ inputs.stale_days || '3' }}
          LIMIT="${{ inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            node scripts/refresh-influencer-profiles.mjs --apply --limit "$LIMIT" --stale-days "$STALE"
          else
            node scripts/refresh-influencer-profiles.mjs --apply --all --stale-days "$STALE"
          fi

      - name: 종료
        if: always()
        run: |
          # 진행 파일 및 .env.local 제거
          rm -f scripts/.refresh-profiles-progress.json .env.local
