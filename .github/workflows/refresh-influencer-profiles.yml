name: 인플루언서 프로필 매일 갱신

# 매일 KST 03:00 (전날 18:00 UTC) 에 실행
# 3-way matrix 로 전체 19,980명을 3등분 병렬 처리
# 각 shard 약 6,660명 × 1.5초 = 약 2.8시간 → 하루 안에 전체 1바퀴 완료
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      stale_days:
        description: 'N일 이상 stale 인 인플루언서만 갱신 (기본 0)'
        required: false
        default: '0'
      reset_progress:
        description: '진행 상태 초기화 (처음부터 다시)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: refresh-influencer-profiles-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  refresh:
    name: shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Supabase JS 2.x: Node 20은 글로벌 WebSocket 미지원으로 createClient 시 실패 → 22+
          node-version: '22'

      - name: 의존성 설치
        run: npm install @supabase/supabase-js ws --no-save --no-audit --no-fund

      - name: 진행 상태 캐시 복원
        uses: actions/cache@v4
        with:
          path: scripts/.refresh-profiles-progress-shard${{ matrix.shard }}of3.json
          key: refresh-influencer-profiles-v3-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            refresh-influencer-profiles-v3-shard${{ matrix.shard }}-

      - name: 진행 상태 초기화 (옵션)
        if: ${{ inputs.reset_progress == 'true' }}
        run: rm -f scripts/.refresh-profiles-progress-shard${{ matrix.shard }}of3.json

      - name: 환경변수 구성
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error ::Supabase secrets 미설정"
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.local

      - name: 갱신 실행 (shard ${{ matrix.shard }}/3)
        run: |
          STALE=${{ inputs.stale_days || '0' }}
          node scripts/refresh-influencer-profiles.mjs --apply --all --stale-days "$STALE" --include-new --resume --shard ${{ matrix.shard }} --shards 3

      - name: 환경변수 정리
        if: always()
        run: rm -f .env.local
