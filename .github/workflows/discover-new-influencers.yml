name: 신규 인플루언서 매일 발굴

# 매일 KST 04:00 (전날 19:00 UTC) 에 실행
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      top:
        description: '상위 N개 키워드 (기본 3500)'
        required: false
        default: '3500'

jobs:
  discover:
    name: keyword_challenges 기반 인플루언서 발굴
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm install @supabase/supabase-js --no-save --no-audit --no-fund

      - name: 환경변수 구성
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error ::Supabase secrets 미설정"
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.local

      # keyword_challenges 11.5만개를 하루 200개씩 돌면 한 바퀴에 약 2년이 걸려
      # 신규 선정자 발굴이 중앙값 50일 지연됐다(2026-08-22 실측). 3,500개면 주기가 약 한 달.
      # 실측 1.6초/키워드 기준 약 93분 — timeout-minutes 180 안.
      - name: 실행
        run: |
          TOP=${{ inputs.top || '3500' }}
          node scripts/discover-new-influencers.mjs --apply --top "$TOP"

      - name: 정리
        if: always()
        run: rm -f scripts/.discover-new-influencers-progress.json .env.local
