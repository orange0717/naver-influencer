# 일일 스케줄로 파이썬 워커 실행 (예시)
#
# GitHub Actions의 schedule 은 저장소 기본 시간대가 **UTC** 입니다.
# cron: '0 15 * * *' → 매일 15:00 UTC = 한국시간 **익일 00:00** (KST = UTC+9, 일광절약 없음)
#
# 필요한 Repository secrets (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#
# 수동 실행: Actions 탭 → 본 워크플로 → "Run workflow"
name: 일일 파이썬 워커 (KST 자정)

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: daily-python-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: workers/daily_sync/requirements.txt

      - name: 의존성 설치
        run: pip install -r workers/daily_sync/requirements.txt

      - name: 일일 작업 실행
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Actions Secrets 에 NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY 를 등록하세요."
            exit 1
          fi
          python workers/daily_sync/main.py
