# 인플루언서 리스트 지표를 DB·화면에 반영합니다. (전체 인플루언서 기준)
#
# 1) ninfle 프로덕션 크론: 챌린지 순위 → 통계 집계 → 선정일(미수집분)
# 2) 전체 인플 프로필·팬수·챌린지수: refresh-influencer-profiles.mjs 워크플로 위임
#    (--all --include-new --stale-days 0 → DB 전원, 3샤드 병렬, 수 시간 소요. 큐만 넣고 본 워크플로는 곧 종료)
#
# GitHub Actions schedule 은 UTC 기준입니다.
# cron: '0 15 * * *' → 매일 15:00 UTC = 한국 자정(KST) 직후
#
# 필요한 Repository secrets:
#   CRON_SECRET  (필수 — Vercel과 동일)
#   (전체 프로필 갱신은 refresh-influencer-profiles.yml 이 Supabase secrets 사용)
# 선택: Repository variables → NINFL_BASE_URL (미설정 시 https://ninfle.kr)
#
# permissions: 동일 저장소의 다른 워크플로(dispatch) 실행에 actions: write 필요
# 참고: refresh-influencer-profiles.yml 이 KST 03:00(18:00 UTC)에도 스케줄되어 있으면 하루 2회 전체 갱신됨. 한쪽만 쓰려면 해당 파일의 schedule 을 조정하세요.

name: 일일 인플 목록 갱신 (KST 자정)

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-ninfle-influencer-sync
  cancel-in-progress: false

jobs:
  refresh-from-ninfle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NINFL_BASE_URL: ${{ vars.NINFL_BASE_URL }}

    steps:
      - name: 챌린지 순위 (TOP3·비율·마지막 챌린지 참여일)
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET 이 없습니다. GitHub Actions secrets 에 등록하세요."
            exit 1
          fi
          BASE="${NINFL_BASE_URL:-https://ninfle.kr}"
          curl --fail --show-error --silent --max-time 320 \
            -A "vercel-cron/1.0" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-cron-auth-token: github-actions-daily-sync" \
            "$BASE/api/cron/crawl-challenge-ranks-scheduled"

      - name: 인플루언서 통계 집계
        run: |
          BASE="${NINFL_BASE_URL:-https://ninfle.kr}"
          curl --fail --show-error --silent --max-time 320 \
            -A "vercel-cron/1.0" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-cron-auth-token: github-actions-daily-sync" \
            "$BASE/api/cron/aggregate-influencers"

      - name: 전체 인플루언서 프로필·팬수·챌린지수 갱신 (3샤드 워크플로 실행)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # scripts/refresh-influencer-profiles.mjs --apply --all --shard k/3
          gh workflow run refresh-influencer-profiles.yml --ref main \
            -f stale_days=0 \
            -f reset_progress=false

      - name: 네이버 선정일(미수집분)
        run: |
          BASE="${NINFL_BASE_URL:-https://ninfle.kr}"
          curl --fail --show-error --silent --max-time 120 \
            -A "vercel-cron/1.0" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-cron-auth-token: github-actions-daily-sync" \
            "$BASE/api/cron/crawl-selection-dates"
