# 인플루언서 리스트 지표가 DB·화면에 반영되도록, 매일 KST 자정에 ninfle 프로덕션 크론을 순서대로 호출합니다.
#
# GitHub Actions schedule 은 UTC 기준입니다.
# cron: '0 15 * * *' → 매일 15:00 UTC = 한국 자정(KST) 직후에 해당하는 시각입니다.
#
# 필요한 Repository secrets:
#   CRON_SECRET  (필수 — Vercel 환경변수와 동일 값)
# 선택: Repository variables → NINFL_BASE_URL (미설정 시 https://ninfle.kr)
#
# 참고: 기존 파이썬 예시(workers/daily_sync/)는 DB 쓰기 없이 연결 테스트용입니다.
#       화면 반영은 아래 curl 단계가 담당합니다.

name: 일일 인플 목록 갱신 (KST 자정)

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: daily-ninfle-influencer-sync
  cancel-in-progress: false

jobs:
  refresh-from-ninfle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NINFL_BASE_URL: ${{ vars.NINFL_BASE_URL }}

    steps:
      - name: 챌린지 순위 (TOP3·비율·마지막 챌린지 참여일)
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET 이 없습니다. GitHub Actions secrets 에 등록하세요."
            exit 1
          fi
          BASE="${NINFL_BASE_URL:-https://ninfle.kr}"
          curl --fail --show-error --silent --max-time 320 \
            -A "vercel-cron/1.0" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-cron-auth-token: github-actions-daily-sync" \
            "$BASE/api/cron/crawl-challenge-ranks-scheduled"

      # crawl-challenge-ranks 안전망과 동일한 인증 헤더(UA + x-vercel-cron-auth-token + Bearer)
      - name: 인플루언서 통계 집계
        run: |
          BASE="${NINFL_BASE_URL:-https://ninfle.kr}"
          curl --fail --show-error --silent --max-time 320 \
            -A "vercel-cron/1.0" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-cron-auth-token: github-actions-daily-sync" \
            "$BASE/api/cron/run?job=aggregate-influencers"

      - name: 팔로워·팬수 갱신
        run: |
          BASE="${NINFL_BASE_URL:-https://ninfle.kr}"
          curl --fail --show-error --silent --max-time 320 \
            -A "vercel-cron/1.0" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-cron-auth-token: github-actions-daily-sync" \
            "$BASE/api/cron/run?job=update-followers"

      - name: 네이버 선정일(미수집분)
        run: |
          BASE="${NINFL_BASE_URL:-https://ninfle.kr}"
          curl --fail --show-error --silent --max-time 120 \
            -A "vercel-cron/1.0" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-cron-auth-token: github-actions-daily-sync" \
            "$BASE/api/cron/run?job=crawl-selection-dates"
