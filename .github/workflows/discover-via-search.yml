name: 신규 인플루언서 매일 발굴 (통합검색)

# Supabase secrets 필수 — .github/GITHUB_ACTIONS_SECRETS.md
# 매일 KST 05:00 (전날 20:00 UTC) — keyword_challenges 워크플로(KST 04:00) 직후
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      top:
        description: '상위 N개 키워드 (기본 5000)'
        required: false
        default: '5000'

jobs:
  discover:
    name: search.naver.com 인플루언서 탭 기반 발굴 (챌린지 미참여 보완)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install @supabase/supabase-js --no-save --no-audit --no-fund

      - name: 환경변수 구성
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error ::Supabase secrets 미설정"
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.local

      - name: 통합검색 기반 발굴 실행
        run: |
          TOP=${{ inputs.top || '5000' }}
          node scripts/discover-via-search.mjs --apply --top "$TOP"

      - name: 신규 등록분 naver_created_at 채우기 (Phase 1)
        run: node scripts/bulk-crawl-details.mjs --phase 1 --force

      - name: 정리
        if: always()
        run: rm -f scripts/.discover-via-search-progress.json .env.local
