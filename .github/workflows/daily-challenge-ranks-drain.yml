# 24h crawl_target 커버 100% 목표 — 미달 시 crawl-challenge-ranks 반복.
# 시크릿: .github/GITHUB_ACTIONS_SECRETS.md
name: 챌린지 순위 일일 drain

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      max_rounds:
        description: '최대 반복 횟수'
        required: false
        default: '40'
      stale_threshold:
        description: 'crawl_target stale 이하이면 종료'
        required: false
        default: '0'

concurrency:
  group: daily-challenge-ranks-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NINFL_BASE_URL: ${{ vars.NINFL_BASE_URL || 'https://ninfle.kr' }}
      NINFLE_CRON_AUTH_LABEL: github-actions-drain
      MAX_ROUNDS: ${{ github.event.inputs.max_rounds || '40' }}
      STALE_THRESHOLD: ${{ github.event.inputs.stale_threshold || '0' }}
      # src/lib/crawl-queue.ts의 PRODUCTION_CRAWL_* 값과 동일하게 유지할 것
      # (2026-07-30: 과거 concurrency=18/batch=800이 login_attempt_logs 지연·
      # DB 리소스 경고를 유발한 적 있어 6/400/2로 하향 동기화)
      SHARDS: '2'
      BATCH: '400'
      CONCURRENCY: '6'

    steps:
      - uses: actions/checkout@v4

      - name: Drain until crawl_target coverage 100%
        run: |
          set -euo pipefail
          source .github/scripts/ninfle-cron-auth.sh
          BASE="${NINFL_BASE_URL:-https://ninfle.kr}"

          for round in $(seq 1 "$MAX_ROUNDS"); do
            COV=$(curl -sS "${NINFLE_CRON_AUTH[@]}" "$BASE/api/cron/verify-daily-coverage" || echo '{"error":"curl failed"}')
            ninfle_cron_assert_json "$COV" "verify-daily-coverage"
            STALE=$(node -e "const j=JSON.parse(process.argv[1]); console.log(j.stale ?? 999999)" "$COV")
            TARGET=$(node -e "const j=JSON.parse(process.argv[1]); console.log(j.crawl_target_total ?? 0)" "$COV")
            PCT=$(node -e "const j=JSON.parse(process.argv[1]); console.log(j.coverage_pct ?? 0)" "$COV")
            echo "Round $round/$MAX_ROUNDS — crawl_target=$TARGET stale=$STALE coverage=${PCT}% (all_active=$(node -e "const j=JSON.parse(process.argv[1]); console.log(j.coverage_pct_all??0)" "$COV")%)"

            if [ "$STALE" -le "$STALE_THRESHOLD" ]; then
              echo "Target reached (crawl_target stale<=$STALE_THRESHOLD)."
              exit 0
            fi

            for SHARD in $(seq 0 $((SHARDS - 1))); do
              echo "  shard $SHARD/$SHARDS ..."
              BODY=$(curl -sS --max-time 320 "${NINFLE_CRON_AUTH[@]}" \
                "$BASE/api/cron/crawl-challenge-ranks?batch=$BATCH&concurrency=$CONCURRENCY&shard=$SHARD&shards=$SHARDS" \
                || echo '{"error":"curl failed"}')
              ninfle_cron_assert_json "$BODY" "crawl-challenge-ranks shard=$SHARD"
              node -e "const j=JSON.parse(process.argv[1]); console.log('   ', JSON.stringify({ok:j.success,processed:j.influencers_processed,skipped:j.skipped,failed:j.failed}));" "$BODY"
            done
            sleep 30
          done

          echo "::warning::Max rounds reached; check /admin/crawler coverage_pct (crawl_target)."
          exit 1
