name: N인플 챌린지 순위 크롤링 안전망

on:
  schedule:
    # Vercel Cron과 동일한 cadence(10분). 지연/비활성화 시 보조 트리거.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: crawl-challenge-ranks-scheduled
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger scheduled crawler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NINFL_BASE_URL: ${{ vars.NINFL_BASE_URL || 'https://ninfle.kr' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is required for the crawler safety-net workflow."
            exit 1
          fi

          curl --fail --show-error --silent \
            -A "vercel-cron/1.0" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-cron-auth-token: github-actions-safety-net" \
            "$NINFL_BASE_URL/api/cron/crawl-challenge-ranks-scheduled"
