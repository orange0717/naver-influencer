# Vercel Cron 보조(5분×3샤드). 시크릿: .github/GITHUB_ACTIONS_SECRETS.md
name: N인플 챌린지 순위 크롤링 안전망

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: crawl-challenge-ranks-scheduled
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NINFL_BASE_URL: ${{ vars.NINFL_BASE_URL || 'https://ninfle.kr' }}
      NINFLE_CRON_AUTH_LABEL: github-actions-safety-net
    steps:
      - uses: actions/checkout@v4

      - name: Trigger scheduled crawler (3 shards)
        run: |
          set -euo pipefail
          source .github/scripts/ninfle-cron-auth.sh
          BASE="${NINFL_BASE_URL:-https://ninfle.kr}"
          for SHARD in 0 1 2; do
            curl --fail --show-error --silent --max-time 320 \
              "${NINFLE_CRON_AUTH[@]}" \
              "$BASE/api/cron/crawl-challenge-ranks-scheduled?shard=$SHARD&shards=3"
          done
