name: 블로거 프로필(포스트 수/최근 포스트일) 매일 갱신

# 매일 KST 02:00 (전날 17:00 UTC) 에 실행
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '하루 처리량 (기본 10000, 로테이션)'
        required: false
        default: '10000'
      stale_days:
        description: 'N일 이상 stale 만 (기본 0 = 전일 이후 갱신 안 된 것)'
        required: false
        default: '0'
      order:
        description: '정렬 (stale=오래된 순 로테이션 / rank=상위 우선)'
        required: false
        default: 'stale'

jobs:
  refresh:
    name: PostTitleListAsync.naver 기반 프로필 갱신
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install @supabase/supabase-js --no-save --no-audit --no-fund

      - name: 환경변수 구성
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error ::Supabase secrets 미설정"
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.local

      - name: 실행
        run: |
          LIMIT=${{ inputs.limit || '10000' }}
          STALE=${{ inputs.stale_days || '0' }}
          ORDER=${{ inputs.order || 'stale' }}
          node scripts/refresh-blogger-profiles.mjs --apply --limit "$LIMIT" --stale-days "$STALE" --order "$ORDER"

      - name: 정리
        if: always()
        run: rm -f scripts/.refresh-blogger-profiles-progress.json .env.local
