name: 키워드챌린지 등수(게시글 수) 매일 갱신

# 매일 KST 05:00 (전날 20:00 UTC) 실행
# 6-way matrix 로 전체 약 13,000명을 6등분 병렬 처리 (스크립트 내부 PARALLEL=5)
# 각 shard 약 2,170명 × 30초 / 5 동시 ≒ 3.6시간 → 하루 안에 전체 1바퀴 완료
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      reset_progress:
        description: '진행 상태 초기화 (처음부터 다시)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: crawl-content-counts-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  crawl:
    name: shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm install @supabase/supabase-js dotenv --no-save --no-audit --no-fund

      - name: 진행 상태 캐시 복원
        uses: actions/cache@v4
        with:
          path: scripts/.content-count-progress-shard${{ matrix.shard }}of6.json
          key: content-count-progress-v2-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            content-count-progress-v2-shard${{ matrix.shard }}-

      - name: 진행 상태 초기화 (옵션)
        if: ${{ inputs.reset_progress == 'true' }}
        run: rm -f scripts/.content-count-progress-shard${{ matrix.shard }}of6.json

      - name: 환경변수 구성
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error ::Supabase secrets 미설정"
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.local

      - name: crawl-content-counts 실행 (shard ${{ matrix.shard }}/6)
        run: |
          node scripts/crawl-content-counts.mjs --resume --all-owners --shard ${{ matrix.shard }} --shards 6

      - name: 환경변수 정리
        if: always()
        run: rm -f .env.local
