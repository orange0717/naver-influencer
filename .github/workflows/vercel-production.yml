# GitHub → Vercel 프로덕션 배포 (Vercel Git 연동이 멈춘 경우 대비)
#
# 아래 Secrets를 저장소에 등록하면, main 푸시마다 프로덕션으로 배포됩니다.
#   VERCEL_TOKEN        : Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID       : 프로젝트 .vercel/project.json 의 orgId (또는 Vercel 대시보드 URL/설정에서 확인)
#   VERCEL_PROJECT_ID   : 동일하게 projectId
#
# 로컬에서 한 번 `vercel link` 후 `.vercel/project.json` 내용을 참고하면 됩니다.

name: Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Detect Vercel secrets
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel GitHub 배포 비활성: Settings → Secrets and variables → Actions 에 VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID 를 추가하세요."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps + Vercel CLI
        if: steps.vercel.outputs.enabled == 'true'
        run: |
          npm ci
          npm install -g vercel@latest

      - name: Pull Vercel env (production)
        if: steps.vercel.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (Vercel)
        if: steps.vercel.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        if: steps.vercel.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
