name: 블로거 순위 주간 갱신

# 매주 화요일 KST 04:00 (월요일 19:00 UTC) 에 실행
on:
  schedule:
    - cron: '0 19 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    name: refresh_blogger_rankings() 실행
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install @supabase/supabase-js --no-save --no-audit --no-fund

      - name: 환경변수 구성
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error ::Supabase secrets 미설정"
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" > .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.local

      - name: 실행
        run: node scripts/refresh-blogger-rankings.mjs

      - name: 정리
        if: always()
        run: rm -f .env.local
